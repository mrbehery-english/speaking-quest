<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Speaking Quest</title><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;background:linear-gradient(135deg,#6a5cff,#25c2a0);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#222}
.card{background:#fff;border-radius:20px;padding:24px;max-width:560px;width:94%;box-shadow:0 10px 30px #0004;text-align:center}
h1{margin:0 0 8px}button{font-size:1.1rem;padding:12px 18px;margin:6px;border:0;border-radius:12px;background:#6a5cff;color:#fff;cursor:pointer}
button:hover{filter:brightness(1.1)}button.ok{background:#1faa59}button.bad{background:#e0453a}button.alt{background:#eee;color:#222}
.big{font-size:2rem;margin:16px 0;min-height:2.4rem}.small{color:#666;font-size:.9rem}input{font-size:1.3rem;padding:10px;border-radius:10px;border:2px solid #ccc;width:80%;text-align:center}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid button{height:70px;background:#6a5cff}.grid button.done{background:#1faa59}.grid button.hide{font-size:0}</style></head><body><div class=card><h1>⚔️ Speaking Quest</h1><div id=lv></div><div class=small id=lvl></div><div class=big id=q style='font-size:1.4rem'></div><div class=small id=ar></div><button onclick=say(P[i][0])>🔊 Listen</button><button onclick=rec()>🎙️ Speak</button><div id=msg class=small></div></div><script>function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}let LEV=0;function mkLevels(n,f){const e=document.getElementById('lv');e.innerHTML='';['Level 1','Level 2','Level 3'].forEach((t,k)=>{const b=document.createElement('button');b.textContent=t;b.className=k===LEV?'':'alt';b.onclick=()=>{LEV=k;mkLevels(n,f);f()};e.appendChild(b)})}function part(D){const n=Math.ceil(D.length/3);return D.slice(LEV*n,(LEV+1)*n)}const D=[["Introduce yourself in one sentence.", "عرّف نفسك"], ["Say what you eat for breakfast.", "فطارك إيه؟"], ["Describe your best friend.", "صف صديقك"], ["Say what you did yesterday.", "عملت إيه امبارح؟"], ["Say what you will do tomorrow.", "هتعمل إيه بكرة؟"], ["Tell me about your family.", "احكي عن عائلتك"], ["Say what the weather is like today.", "الجو عامل إزاي؟"], ["Ask someone for directions to the library.", "اسأل عن طريق المكتبة"], ["Describe your daily routine.", "روتينك اليومي"], ["Say what you like to do at the weekend.", "بتعمل إيه في الويكند؟"], ["Describe your house.", "صف بيتك"], ["Say what you are wearing today.", "لابس إيه النهارده؟"], ["Order food in a restaurant.", "اطلب أكل في مطعم"], ["Tell me about your favourite food.", "أكلتك المفضلة"], ["Say what your school is like.", "صف مدرستك"], ["Talk about your favourite teacher.", "مدرسك المفضل"], ["Compare two things you know. Use 'bigger' or 'better'.", "قارن بين حاجتين"], ["Say what you have been doing this week.", "عملت إيه الأسبوع ده؟"], ["Give advice to a friend who is sad.", "انصح صاحب زعلان"], ["Say what you would do if you had a million pounds.", "لو معاك مليون هتعمل إيه؟"], ["Describe a place you want to visit and why.", "مكان نفسك تزوره"], ["Tell a short story about a lost phone.", "احكي قصة عن موبايل ضايع"]];let P=[],i=0,xp=0;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;function start(){P=part(D);i=0;show()}function show(){if(i>=P.length){q.textContent='🏆 Level complete! XP '+xp;ar.textContent='';lvl.textContent='';return}lvl.textContent='Mission '+(i+1)+'/'+P.length+'  XP '+xp;q.textContent=P[i][0];ar.textContent=P[i][1];msg.textContent=''}function rec(){if(i>=P.length)return;if(!SR){msg.textContent='Use Chrome or Edge for the microphone.';return}const r=new SR();r.lang='en-US';r.onresult=e=>{const h=e.results[0][0].transcript;const n=h.trim().split(/\s+/).length;if(n>=4){xp+=n*5;msg.textContent='✅ '+h;i++;setTimeout(show,1500)}else msg.textContent='Say a full sentence (4+ words). I heard: '+h};r.start();msg.textContent='Listening...'}mkLevels(3,start);start();</script></body></html>
