<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Speaking Quest</title><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;margin:0;background:linear-gradient(135deg,#6a5cff,#25c2a0);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#222}
.card{background:#fff;border-radius:20px;padding:24px;max-width:560px;width:94%;box-shadow:0 10px 30px #0004;text-align:center}
h1{margin:0 0 8px}button{font-size:1.1rem;padding:12px 18px;margin:6px;border:0;border-radius:12px;background:#6a5cff;color:#fff;cursor:pointer}
button:hover{filter:brightness(1.1)}button.ok{background:#1faa59}button.bad{background:#e0453a}button.alt{background:#eee;color:#222}
.big{font-size:2rem;margin:16px 0;min-height:2.4rem}.small{color:#666;font-size:.9rem}input{font-size:1.3rem;padding:10px;border-radius:10px;border:2px solid #ccc;width:80%;text-align:center}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid button{height:70px;background:#6a5cff}.grid button.done{background:#1faa59}.grid button.hide{font-size:0}</style></head><body><div class=card><h1>⚔️ Speaking Quest</h1><div class=small id=lv></div><div class=big id=q style='font-size:1.4rem'></div><button onclick=say(Q[i])>🔊 Listen</button><button onclick=rec()>🎙️ Speak</button><div id=msg class=small></div><div class=small id=hp></div></div><script>function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}const Q=["Introduce yourself in one sentence.", "Say what you eat for breakfast.", "Describe your best friend.", "Say what you did yesterday.", "Say what you will do tomorrow.", "Tell me about your family.", "Say what the weather is like today.", "Ask someone for directions to the library."];let i=0,xp=0;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;function show(){if(i>=Q.length){q.textContent='🏆 Quest complete! XP '+xp;lv.textContent='';return}lv.textContent='Mission '+(i+1)+'/'+Q.length+'  XP '+xp;q.textContent=Q[i];msg.textContent=''}function rec(){if(!SR){msg.textContent='Use Chrome or Edge for the microphone.';return}const r=new SR();r.lang='en-US';r.onresult=e=>{const h=e.results[0][0].transcript;const n=h.trim().split(/\s+/).length;if(n>=4){xp+=n*5;msg.textContent='✅ '+h;i++;setTimeout(show,1500)}else msg.textContent='Say a full sentence (4+ words). I heard: '+h};r.start();msg.textContent='Listening...'}show();</script></body></html>
